services:
  - type: web
    name: school-management-backend
    env: docker
    region: oregon
    plan: free
    repo: https://github.com/abuobernard/School-management-sytem
    branch: main
    dockerfile: Dockerfile
    buildCommand: cd School-backend && mvn clean package -DskipTests
    startCommand: java -jar target/School-management-sytem-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DB_URL
        value: jdbc:mysql://mysql-22af9249-abuobernard-2afb.d.aivencloud.com:16535/school_manager_v2?sslMode=REQUIRED
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: GHS
      - key: PAYSTACK_CALLBACK_URL
        value: https://school-management-sytem-seven.vercel.app/dashboard/fees
